name: Build debug APK

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install Android SDK packages
        # Keep these aligned with app/build.gradle.kts and the AGP build tools requirement.
        # API 37 is published with a minor version in its package ID (37.0, not 37).
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'

      - name: Build debug APK
        # The wrapper is tracked without its executable bit. Do not depend on local.properties.
        run: bash ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Prepare APK filename
        # Unarchived artifacts use the filename as their artifact name.
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/enetrend-debug-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}.apk"

      - name: Save debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: app/build/outputs/apk/debug/enetrend-debug-${{ github.sha }}-${{ github.run_attempt }}.apk
          if-no-files-found: error
          retention-days: 14
          archive: false
